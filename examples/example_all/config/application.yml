server:
  port: 8080

spring:
  profiles:
    active: default

# 启动行为
startup:
  fail_fast: false

# 自定义配置
app:
  name: example-all
  version: 1.0.0
  greeting: Hello from example_all!
  greeting_dev: Hello from dev profile!
  admin_users:
    - admin
    - superadmin

# MySQL 数据库配置（与仓库 docker-compose.integration.yml 保持一致）
database:
  enabled: true
  orm: mybatis
  driver: mysql
  host: 127.0.0.1
  port: 3306
  database: springpy
  username: root
  password: ${DB_PASSWORD:root123}
  min_size: 1
  max_size: 5
  leak_detection_enabled: false
  mapper_locations:
    - example_all/mappers
  # DDL 自动建表（JPA hibernate.ddl-auto 风格）
  # mode: none(跳过) / create(每次启动重建) / update(只加不减) / validate(只校验) / create-drop(建表+关闭删除)
  ddl-auto:
    mode: update
    entity_packages:
      - example_all.models
      - example_all.common
  security:
    block_ddl: false
    sql_injection_detection: false

# Redis 配置 (Docker: redis:7-alpine)
redis:
  enabled: true
  host: localhost
  port: 6379
  db: 0
  password: ""

# 缓存配置
cache:
  enabled: true
  ttl: 300
  max_size: 1000

# 重试配置
retry:
  enabled: true
  default_max_retries: 3
  default_delay: 1000

# JWT 安全配置
jwt:
  enabled: true
  secret: example_all_jwt_secret_key_2024_with_strong_entropy_32bytes
  expiration: 3600

# Nacos 服务发现 (Docker: nacos/nacos-server)
discovery:
  enabled: true
  server_addr: "localhost:8848"
  namespace: ""
  group: "DEFAULT_GROUP"
  username: "nacos"
  password: "nacos"
  timeout: 3

# RabbitMQ 消息队列 (Docker: rabbitmq:3-management-alpine)
rabbitmq:
  enabled: true
  host: localhost
  port: 5672
  username: admin
  password: admin123
  virtual_host: "/"
  connection_timeout: 5
  socket_timeout: 5
  stack_timeout: 5
  connection_attempts: 1
  retry_delay: 0
  blocked_connection_timeout: 300

# Prometheus 监控
prometheus:
  enabled: true
  namespace: spring
  subsystem: example_all
  port: 8000

# 配置来源/热刷新监控（默认关闭；需要排查 Nacos 或环境配置时再开启）
management:
  config-monitor:
    enabled: ${MANAGEMENT_CONFIG_MONITOR_ENABLED:false}
    include-values: ${MANAGEMENT_CONFIG_MONITOR_INCLUDE_VALUES:false}
    history-size: ${MANAGEMENT_CONFIG_MONITOR_HISTORY_SIZE:100}
    refresh-events: ${MANAGEMENT_CONFIG_MONITOR_REFRESH_EVENTS:true}
