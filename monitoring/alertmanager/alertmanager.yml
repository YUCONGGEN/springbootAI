# Alertmanager 通知渠道配置
# 告警通知发送到以下渠道，按需启用

global:
  resolve_timeout: 5m

# 告警分组/抑制/路由规则
route:
  group_by: ["alertname", "instance"]
  group_wait: 10s          # 首次告警等待 10 秒后发送（聚合同组告警）
  group_interval: 30s      # 同组告警间隔
  repeat_interval: 4h      # 相同告警重复发送间隔
  receiver: "webhook"      # 默认通知渠道

receivers:
  # ─── Webhook 通知（通用，可对接钉钉/企业微信机器人）───
  - name: "webhook"
    webhook_configs:
      - url: "http://host.docker.internal:8000/actuator/alert"  # SpringBootAI Webhook 接收端
        send_resolved: true

  # ─── 邮件通知（需配置 SMTP）───
  # 取消注释并填写 SMTP 信息后启用
  # - name: "email"
  #   email_configs:
  #     - to: "ops@company.com"
  #       from: "alertmanager@company.com"
  #       smarthost: "smtp.company.com:587"
  #       auth_username: "alertmanager@company.com"
  #       auth_password: "your-smtp-password"
  #       require_tls: true

  # ─── 钉钉机器人 ───
  # 需要在钉钉群中创建自定义机器人，获取 webhook URL
  # - name: "dingtalk"
  #   webhook_configs:
  #     - url: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN"
  #       send_resolved: true

  # ─── 企业微信机器人 ───
  # - name: "wechat"
  #   webhook_configs:
  #     - url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY"
  #       send_resolved: true

# 告警抑制规则
inhibit_rules:
  # 如果 AppDown（critical）已触发，则抑制同实例的 ScrapeFailure（info）
  - source_match:
      severity: critical
    target_match:
      severity: info
    equal: ["instance"]
