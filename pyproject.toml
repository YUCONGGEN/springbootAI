[project]
# Distribution name: springbootAI (pip install springbootAI); import package: springbootai.
name = "springbootAI"
version = "2.3.5"
description = "Spring-style Python framework with Web, ORM, Cloud and AI integrations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "YuConggen", email = "1516933915@qq.com" }
]
keywords = ["spring", "springboot", "mybatis", "orm", "web", "framework", "python", "ai", "langchain", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10"

