[build-system]
requires = ["setuptools>=77", "wheel>=0.37"]
build-backend = "setuptools.build_meta"

# ========================================
# SpringBootAI 项目元数据与依赖声明（PEP 621）
# 本文件是依赖的单一真实来源，类似 Spring Boot 的 pom.xml
# 版本锁定策略：所有直接依赖使用 == 精确锁定
# 实验性 HTTP 补偿协调器不提供 Seata AT 语义；生产分布式事务需要真实协调器
# ========================================

[project]
# 发行名 springbootAI（PyPI 包名，pip install springbootAI）；导入包名仍为 spring
name = "springbootAI"
version = "2.0.2"
description = "Python版Spring Boot框架，集成PyMyBatis ORM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "YuConggen", email = "1516933915@qq.com" }
]
keywords = ["spring", "springboot", "mybatis", "orm", "web", "framework", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10"

# ========================================
# 核心依赖 - 类似 Spring Boot Starter Web/Core
# 安装：pip install springbootAI
# ========================================
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.39.0",
    "websockets==16.1.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "DBUtils==3.1.2",
    "cryptography==50.0.0",
    "bcrypt==5.0.0",
    "pyjwt==2.13.0",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# ========================================
# 数据库驱动 - 类似 Spring Boot Starter JDBC/Data JPA
# ========================================
mysql = ["PyMySQL==1.2.0"]
postgresql = ["psycopg2-binary==2.9.12"]
sqlalchemy = ["sqlalchemy==2.0.40"]

# ========================================
# Redis - 类似 Spring Boot Starter Data Redis
# ========================================
redis = ["redis==8.1.0"]

# ========================================
# 消息队列 - 类似 Spring Boot Starter AMQP
# ========================================
rabbitmq = ["pika==1.4.4"]

# ========================================
# 服务发现 - 类似 Spring Cloud Alibaba Nacos
# ========================================
nacos = ["nacos-sdk-python==2.0.11"]

# ========================================
# 监控和日志 - 类似 Spring Boot Actuator + Micrometer
# ========================================
prometheus = ["prometheus-client==0.26.0"]
logging = ["loguru==0.7.3"]

# ========================================
# SQL注入检测
# ========================================
ast = ["sqlglot==27.28.1"]

# ========================================
# Excel 注解驱动读写 - 类似 alibaba EasyExcel
# 安装：pip install springbootAI[excel]
# ========================================
excel = ["openpyxl==3.1.5"]

# ========================================
# SpringBootAI AI 模块 - 对齐 Spring AI（ChatClient/Advisor/ETL/Tools）
# 安装：pip install springbootAI[ai]
# AI 模块采用"可选依赖 + 降级"设计：未安装仍可用（降级原生 HTTP + FakeChatModel）
# 依赖清单同步自 requirements-ai.txt（所有版本号 == 已测试验证）
# ========================================
ai = [
    "langchain-openai==1.4.1",
    "langchain-core==1.5.1",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.2",
    "langchain-community==0.4.2",
    "numpy==2.2.6",
    "pydantic==2.13.4",
]

# ========================================
# SpringBootAI LangChain 模块 - 封装 langchain classic 全套能力 + 30+ partner 提供商
# 安装：pip install springbootAI[langchain]
# 设计：partner 包按需启用，未安装的 partner 由 @ConditionalOnClass/友好错误自动跳过
# 详见 doc/LANGCHAIN_MODULE.md
# ========================================
langchain = [
    "langchain-openai==1.4.1",
    "langchain-core==1.5.1",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.2",
    "langchain-community==0.4.2",
    "numpy==2.2.6",
    "pydantic==2.13.4",
    # 默认装上的向量库/文档/工具依赖（安全：全部锁定已知安全版本）
    "faiss-cpu>=1.7.4,<2",
    "pypdf>=4.0.0,<6",
    "beautifulsoup4>=4.12.0,<5",
    "sqlalchemy>=2.0.0,<3",
    # partner 提供商包（按需启用，下面是常用几款；其余见 PARTNER_REGISTRY 文档按需 pip install）
    # 安全：锁定上限版本防止供应链攻击，pip-audit 会在 CI 中持续扫描
    "langchain-anthropic>=0.2.0,<2",
    "langchain-ollama>=0.2.0,<2",
    "langchain-chroma>=0.1.0,<2",
    "langchain-mistralai>=0.2.0,<2",
    "langchain-cohere>=0.3.0,<2",
    "langchain-google-vertexai>=2.0.0,<3",
    "langchain-deepseek>=0.1.0,<2",
    "langchain-zhipuai>=0.0.1,<2",
    "langchain-experimental>=0.3.0,<2",
]

# ========================================
# 开发依赖
# ========================================
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "redis==8.1.0",
    "sqlglot==27.28.1",
]

# ========================================
# 全部依赖（一键安装）
# ========================================
full = [
    # 数据库驱动
    "PyMySQL==1.2.0",
    "psycopg2-binary==2.9.12",
    "sqlalchemy==2.0.40",
    # 缓存 / 消息 / 服务发现
    "redis==8.1.0",
    "pika==1.4.4",
    "nacos-sdk-python==2.0.11",
    # 监控 / 日志 / 安全
    "prometheus-client==0.26.0",
    "loguru==0.7.3",
    "sqlglot==27.28.1",
    # HTTP 客户端
    "requests==2.34.2",
    "httpx==0.28.1",
    # Excel
    "openpyxl==3.1.5",
    # AI 模块（对齐 springbootAI[ai]）
    "langchain-openai==1.4.1",
    "langchain-core==1.5.1",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.2",
    "langchain-community==0.4.2",
    "numpy==2.2.6",
    "pydantic==2.13.4",
    # LangChain 模块增强（对齐 springbootAI[langchain]）
    "faiss-cpu>=1.7.4,<2",
    "pypdf>=4.0.0,<6",
    "beautifulsoup4>=4.12.0,<5",
    "langchain-experimental>=0.3.0,<2",
    # partner 提供商包（按需启用；可选 partner 未在此列出，pip install 对应包即可）
    "langchain-anthropic>=0.2.0,<2",
    "langchain-ollama>=0.2.0,<2",
    "langchain-chroma>=0.1.0,<2",
    "langchain-mistralai>=0.2.0,<2",
    "langchain-cohere>=0.3.0,<2",
    "langchain-google-vertexai>=2.0.0,<3",
    "langchain-deepseek>=0.1.0,<2",
    "langchain-zhipuai>=0.0.1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    # 静默 langchain_classic 弃用告警和 community sunset 告警
    # 原因：本项目有意锁定 langchain classic (1.x) API，这些是预期内的框架级告警
    # 注意：LangChainDeprecationWarning 是 DeprecationWarning 子类，
    #      pytest 的 default::DeprecationWarning 会覆盖 simplefilter，
    #      因此必须在此配置中明确忽略。
    "ignore:.*LLMChain.*:DeprecationWarning",
    "ignore:.*ConversationChain.*:DeprecationWarning",
    "ignore:.*ConversationBufferMemory.*:DeprecationWarning",
    "ignore:.*ConversationBufferWindowMemory.*:DeprecationWarning",
    "ignore:.*ConversationSummaryMemory.*:DeprecationWarning",
    "ignore:.*ConversationTokenBufferMemory.*:DeprecationWarning",
    "ignore:.*LLMMathChain.*:DeprecationWarning",
    "ignore:.*AgentExecutor.*:DeprecationWarning",
    "ignore:.*initialize_agent.*:DeprecationWarning",
    "ignore:.*langchain-community.*sunset.*:DeprecationWarning",
    "ignore:.*langchain-community.*no longer.*:DeprecationWarning",
]
markers = [
    "integration: requires real Docker-backed middleware services",
    "seata_integration: requires a compatible Seata SDK and real Seata Server",
]

[project.urls]
Homepage = "https://github.com/YUCONGGEN/springbootAI"
Repository = "https://github.com/YUCONGGEN/springbootAI.git"

[project.scripts]
springbootai = "spring.main:run_cli"

[tool.setuptools.packages.find]
include = ["spring*"]
namespaces = false

[tool.setuptools.package-data]
spring = ["*.py", "**/*.py", "**/*.xml", "**/*.yml", "**/*.yaml"]
