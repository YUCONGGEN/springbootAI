[tool.pytest.ini_options]
pythonpath = [".", "examples"]
filterwarnings = [
    # 闈欓粯 langchain_classic 寮冪敤鍛婅鍜?community sunset 鍛婅
    # 鍘熷洜锛氭湰椤圭洰鏈夋剰閿佸畾 langchain classic (1.x) API锛岃繖浜涙槸棰勬湡鍐呯殑妗嗘灦绾у憡璀?
    # 娉ㄦ剰锛歀angChainDeprecationWarning 鏄?DeprecationWarning 瀛愮被锛?
    #      pytest 鐨?default::DeprecationWarning 浼氳鐩?simplefilter锛?
    #      鍥犳蹇呴』鍦ㄦ閰嶇疆涓槑纭拷鐣ャ€?
    "ignore:.*LLMChain.*:DeprecationWarning",
    "ignore:.*ConversationChain.*:DeprecationWarning",
    "ignore:.*ConversationBufferMemory.*:DeprecationWarning",
    "ignore:.*ConversationBufferWindowMemory.*:DeprecationWarning",
    "ignore:.*ConversationSummaryMemory.*:DeprecationWarning",
    "ignore:.*ConversationTokenBufferMemory.*:DeprecationWarning",
    "ignore:.*LLMMathChain.*:DeprecationWarning",
    "ignore:.*AgentExecutor.*:DeprecationWarning",
    "ignore:.*initialize_agent.*:DeprecationWarning",
    "ignore:.*langchain-community.*sunset.*:DeprecationWarning",
    "ignore:.*langchain-community.*no longer.*:DeprecationWarning",
]
markers = [
    "integration: requires real Docker-backed middleware services",
    "seata_integration: requires a compatible Seata SDK and real Seata Server",
]

[project.urls]
Homepage = "https://github.com/YUCONGGEN/springbootAI"
Repository = "https://github.com/YUCONGGEN/springbootAI.git"
Documentation = "https://github.com/YUCONGGEN/springbootAI#readme"
Changelog = "https://github.com/YUCONGGEN/springbootAI/blob/master/CHANGELOG.md"
Issues = "https://github.com/YUCONGGEN/springbootAI/issues"

[project.scripts]
springbootai = "springbootai.main:run_cli"
# 椤圭洰鑴氭墜鏋跺伐鍏凤紙绫讳技 Spring Initializr锛夈€傜湡瀹炵粓绔粯璁や腑鏂囬棶绛旓紱
# CI/鑴氭湰璇锋樉寮忎娇鐢細springbootai-init my-project --modules web,orm --non-interactive
springbootai-init = "springbootai.cli.scaffold:main"

[tool.setuptools.packages.find]
include = ["springbootai*"]
namespaces = false

[tool.setuptools.package-data]
springbootai = ["*.py", "**/*.py", "**/*.xml", "**/*.yml", "**/*.yaml"]
