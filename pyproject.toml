[build-system]
requires = ["setuptools>=77", "wheel>=0.37"]
build-backend = "setuptools.build_meta"

# ========================================
# SpringBootAI 项目元数据与依赖声明（PEP 621）
# 本文件是依赖的唯一真实来源，类似 Spring Boot 的 pom.xml。
# 核心依赖使用精确版本；LangChain partner 包使用带上限的兼容范围。
# 内置 HTTP/AT 模式是受限补偿机制；生产分布式事务需要真实协调器和业务幂等。
# ========================================

[project]
# Distribution name: springbootAI (pip install springbootAI); import package: springbootai.
name = "springbootAI"
version = "2.3.11"
description = "Spring-style Python framework with Web, ORM, Cloud and AI integrations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "YuConggen", email = "1516933915@qq.com" }
]
keywords = ["spring", "springboot", "mybatis", "orm", "web", "framework", "python", "ai", "langchain", "langgraph", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10,<3.13"

# ========================================
# 核心依赖——类似 Spring Boot Starter Web/Core
# 安装：pip install springbootAI
# ========================================
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "websockets==15.0.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "DBUtils==3.1.2",
    "cryptography==50.0.0",
    "bcrypt==5.0.0",
    "pyjwt==2.13.0",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "httpx==0.28.1",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
# ========================================
# 数据库驱动——类似 Spring Boot Starter JDBC/Data JPA
# ========================================
mysql = ["PyMySQL==1.2.0"]
postgresql = ["psycopg2-binary==2.9.12"]
sqlalchemy = ["sqlalchemy==2.0.40"]

# ========================================
# Redis——类似 Spring Boot Starter Data Redis
# ========================================
redis = ["redis==8.1.0"]

# ========================================
# 消息队列——类似 Spring Boot Starter AMQP
# ========================================
rabbitmq = ["pika==1.4.4"]
kafka = ["kafka-python==2.0.2"]

# ========================================
# 服务发现——类似 Spring Cloud Alibaba Nacos
# ========================================
nacos = ["nacos-sdk-python==2.0.11"]

# ========================================
# 监控和日志——类似 Spring Boot Actuator + Micrometer
# ========================================
prometheus = ["prometheus-client==0.26.0"]
logging = ["loguru==0.7.3"]

# ========================================
# SQL 结构分析（可选 AST 校验）
# ========================================
ast = ["sqlglot==27.28.1"]

# ========================================
# Excel 注解驱动读写——类似 Alibaba EasyExcel
# 安装：pip install springbootAI[excel]
# ========================================
excel = ["openpyxl==3.1.5"]

# ========================================
# SpringBootAI AI 模块——对齐 Spring AI（ChatClient/Advisor/ETL/Tools）
# 安装：pip install springbootAI[ai]
# 可选依赖未安装时核心包仍可导入；真实模型能力需安装对应 extra。
# 依赖清单与 requirements-ai.txt 保持同步。
# ========================================
ai = [
    "langchain-openai==1.4.2",
    "langchain-core==1.5.4",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.2",
    "langchain-community==0.4.2",
    "numpy==2.2.6",
    "pydantic==2.13.4",
]

# ========================================
# SpringBootAI LangChain 模块——封装 langchain classic 与常用 partner
# 安装：pip install springbootAI[langchain]
# partner 包按需启用；未安装的 provider 会跳过并给出明确提示。
# 详见 doc/LANGCHAIN_MODULE.md
# ========================================
langchain = [
    "langchain-openai==1.4.2",
    "langchain-core==1.5.4",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.2",
    "langchain-community==0.4.2",
    "numpy==2.2.6",
    "pydantic==2.13.4",
    # 默认安装的向量库、文档和工具依赖
    "faiss-cpu>=1.7.4,<2",
    "pypdf>=4.0.0,<6",
    "beautifulsoup4>=4.12.0,<5",
    "sqlalchemy>=2.0.0,<3",
    # 常用 partner 包；其他 provider 见 PARTNER_REGISTRY，按需安装。
    # 所有兼容范围均设置上限，并由 CI 持续执行依赖审计。
    "langchain-anthropic>=0.2.0,<2",
    "langchain-ollama>=0.2.0,<2",
    "langchain-chroma>=0.1.0,<2",
    "langchain-mistralai>=0.2.0,<2",
    "langchain-cohere>=0.3.0,<2",
    "langchain-google-vertexai>=2.0.0,<3",
    "langchain-deepseek>=0.1.0,<2",
    "langchain-zhipuai>=0.0.1,<2",
    "langchain-experimental>=0.3.0,<2",
]

# ========================================
# SpringBootAI LangGraph 模块——状态图、持久化检查点与工作流编排
# 安装：pip install springbootAI[langgraph]
# 版本与 langchain-core 1.x 兼容矩阵保持一致。
# ========================================
langgraph = [
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.1",
]

# Model Context Protocol client/server integration (official Python SDK v2)
# Install with: pip install springbootAI[mcp]
mcp = [
    "mcp==2.0.0",
]

# ========================================
# 组合 Starter——类似 Spring Boot Starter Web/Cloud/All
# 安装：pip install springbootAI[web] / springbootAI[cloud] / springbootAI[all]
# ========================================
web = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "pydantic==2.13.4",
    "python-multipart==0.0.20",
]
cloud = [
    "springbootAI[web]",
    "springbootAI[redis]",
    "springbootAI[rabbitmq]",
    "springbootAI[kafka]",
    "httpx==0.28.1",
]
all = [
    "springbootAI[web]",
    "springbootAI[mysql]",
    "springbootAI[redis]",
    "springbootAI[rabbitmq]",
    "springbootAI[kafka]",
    "springbootAI[prometheus]",
    "springbootAI[logging]",
    "springbootAI[excel]",
    "springbootAI[ai]",
    "springbootAI[langchain]",
    "springbootAI[langgraph]",
    "springbootAI[mcp]",
    "httpx==0.28.1",
    "psutil==6.1.1",
]

# ========================================
# 开发依赖
# ========================================
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==1.18.2",
    "redis==8.1.0",
    "sqlglot==27.28.1",
]

# ========================================
# 全部依赖（一键安装）
# ========================================
full = [
    # 数据库驱动
    "PyMySQL==1.2.0",
    "psycopg2-binary==2.9.12",
    "sqlalchemy==2.0.40",
    # 缓存 / 消息 / 服务发现
    "redis==8.1.0",
    "pika==1.4.4",
    "nacos-sdk-python==2.0.11",
    # 监控 / 日志 / 安全
    "prometheus-client==0.26.0",
    "loguru==0.7.3",
    "sqlglot==27.28.1",
    "defusedxml==0.7.1",
    # HTTP 客户端
    "requests==2.34.2",
    "httpx==0.28.1",
    # Excel
    "openpyxl==3.1.5",
    # AI 模块（对齐 springbootAI[ai]）
    "langchain-openai==1.4.2",
    "langchain-core==1.5.4",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.2",
    "langchain-community==0.4.2",
    "numpy==2.2.6",
    "pydantic==2.13.4",
    # LangChain 模块增强（对齐 springbootAI[langchain]）
    "faiss-cpu>=1.7.4,<2",
    "pypdf>=4.0.0,<6",
    "beautifulsoup4>=4.12.0,<5",
    "langchain-experimental>=0.3.0,<2",
    # 常用 partner 包；其他 provider 可按需安装对应包。
    "langchain-anthropic>=0.2.0,<2",
    "langchain-ollama>=0.2.0,<2",
    "langchain-chroma>=0.1.0,<2",
    "langchain-mistralai>=0.2.0,<2",
    "langchain-cohere>=0.3.0,<2",
    "langchain-google-vertexai>=2.0.0,<3",
    "langchain-deepseek>=0.1.0,<2",
    "langchain-zhipuai>=0.0.1,<2",
    # LangGraph
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.1",
    # Model Context Protocol client/server
    "mcp==2.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "examples"]
testpaths = ["tests"]
filterwarnings = [
    # 静默 langchain_classic 弃用告警和 community sunset 告警。
    # 项目当前有意兼容 classic 1.x API，这些属于已知的框架级告警。
    # LangChainDeprecationWarning 是 DeprecationWarning 子类，因此在这里精确过滤。
    "ignore:.*LLMChain.*:DeprecationWarning",
    "ignore:.*ConversationChain.*:DeprecationWarning",
    "ignore:.*ConversationBufferMemory.*:DeprecationWarning",
    "ignore:.*ConversationBufferWindowMemory.*:DeprecationWarning",
    "ignore:.*ConversationSummaryMemory.*:DeprecationWarning",
    "ignore:.*ConversationTokenBufferMemory.*:DeprecationWarning",
    "ignore:.*LLMMathChain.*:DeprecationWarning",
    "ignore:.*AgentExecutor.*:DeprecationWarning",
    "ignore:.*initialize_agent.*:DeprecationWarning",
    "ignore:.*langchain-community.*sunset.*:DeprecationWarning",
    "ignore:.*langchain-community.*no longer.*:DeprecationWarning",
]
markers = [
    "integration: requires real Docker-backed middleware services",
    "seata_integration: requires a compatible Seata SDK and real Seata Server",
]

[tool.coverage.run]
branch = true
source = ["springbootai"]

[tool.coverage.report]
fail_under = 68
show_missing = true

[tool.mypy]
python_version = "3.10"
files = [
    "springbootai/ai/annotation_runtime.py",
    "springbootai/ai/advisors.py",
    "springbootai/ai/vectorstore.py",
    "springbootai/cloud/gateway.py",
    "springbootai/websocket/router.py",
    "springbootai/messaging/kafka.py",
    "springbootai/messaging/rabbitmq.py",
    "springbootai/data/repository.py",
    "springbootai/retry/retry_decorator.py",
    "springbootai/ai/tools.py",
    "springbootai/cloud/bus.py",
    "springbootai/cloud/tracer.py",
    "springbootai/mcp/client.py",
    "springbootai/mcp/config.py",
    "springbootai/monitoring/prometheus.py",
    "springbootai/orm/pymybatis/core/sql_session.py",
    "springbootai/orm/pymybatis/security/access_control.py",
    "springbootai/tx/synchronization.py",
]
ignore_missing_imports = true
follow_imports = "skip"
allow_untyped_defs = true
allow_incomplete_defs = true
check_untyped_defs = true
show_error_codes = true

[project.urls]
Homepage = "https://github.com/YUCONGGEN/springbootAI"
Repository = "https://github.com/YUCONGGEN/springbootAI.git"
Documentation = "https://github.com/YUCONGGEN/springbootAI#readme"
Changelog = "https://github.com/YUCONGGEN/springbootAI/blob/master/CHANGELOG.md"
Issues = "https://github.com/YUCONGGEN/springbootAI/issues"

[project.scripts]
springbootai = "springbootai.main:run_cli"
# 项目脚手架工具（类似 Spring Initializr）。真实终端默认使用中文问答；
# CI/脚本请显式使用：springbootai-init my-project --modules web,orm --non-interactive
springbootai-init = "springbootai.cli.scaffold:main"

[tool.setuptools.packages.find]
include = ["springbootai*"]
namespaces = false

[tool.setuptools.package-data]
springbootai = ["*.py", "py.typed", "**/*.py", "**/*.xml", "**/*.yml", "**/*.yaml"]
