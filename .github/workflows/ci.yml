name: CI

# ====================================================================
# CI 工作流：核心模块 + AI 模块 + LangChain 模块 全量测试
#
# 测试矩阵：
#   - Python 3.10 / 3.12 双版本
#   - 核心测试（无 AI 依赖）：spring 核心 + ORM + Web + 注解
#   - AI 测试：FakeChatModel 降级，无需 API Key
#   - LangChain 测试：585 个用例，FakeChatModel 降级，无需 API Key
#   - Demo 冒烟测试：15 章节完整能力演示
#
# 环境变量：
#   AI_ALLOW_FAKE=true — 无 API Key 时降级 FakeChatModel，保证 CI 无网络也能跑
# ====================================================================

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AI_ALLOW_FAKE: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt
        pip install pip-audit==2.10.1

    - name: Install AI & LangChain dependencies
      run: |
        pip install -r requirements-ai.txt
        # 可选依赖：安装失败不阻塞 CI（测试中已用 pytest.skip 容错）
        pip install faiss-cpu || echo "faiss-cpu 不可用，相关测试将 skip"
        pip install pypdf || echo "pypdf 不可用，相关测试将 skip"
        pip install beautifulsoup4 || echo "beautifulsoup4 不可用，相关测试将 skip"

    - name: Static code check with py_compile
      run: |
        echo "Compiling all Python files under spring/..."
        python -m py_compile $(find spring/ -name "*.py" -type f)
        echo "py_compile check passed"

    - name: Run core unit tests (no AI dependency)
      run: |
        pytest tests/ \
          --ignore=tests/test_ai_module.py \
          --ignore=tests/test_langchain_module.py \
          --ignore=tests/test_langchain_ext.py \
          -v --tb=short --cov=spring --cov-report= --cov-fail-under=0

    - name: Run AI module tests (87 tests, FakeChatModel)
      run: |
        echo "Running AI module tests (87 tests)..."
        pytest tests/test_ai_module.py -v --tb=short \
          --cov=spring.ai --cov-append --cov-report=term

    - name: Run LangChain module tests (585 tests, FakeChatModel)
      run: |
        echo "Running LangChain base tests (75 tests)..."
        pytest tests/test_langchain_module.py -v --tb=short
        echo ""
        echo "Running LangChain extended tests (510 tests)..."
        pytest tests/test_langchain_ext.py -v --tb=short

    - name: Run LangChain demo smoke test (15 chapters)
      run: |
        echo "Running LangChain full demo (15 chapters, no API Key needed)..."
        python example_langchain/demo/langchain_full_demo.py

    - name: Run real runtime-path tests with cumulative coverage gate
      run: |
        pytest tests_runtime/ -v --tb=short \
          --cov=spring --cov-append --cov-report=xml --cov-report=term \
          --cov-fail-under=51

    - name: Module import verification (including spring.langchain)
      run: |
        python -c "
        import spring
        import spring.annotations
        import spring.annotations.core
        import spring.annotations.cloud
        import spring.annotations.messaging
        import spring.aop
        import spring.cloud
        import spring.config
        import spring.context
        import spring.core
        import spring.event
        import spring.logging
        import spring.messaging
        import spring.monitoring
        import spring.orm
        import spring.orm.pymybatis
        import spring.retry
        import spring.scheduling
        import spring.security
        import spring.tracing
        import spring.utils
        import spring.web
        import spring.ai
        import spring.langchain
        print('All module imports successful (including spring.ai + spring.langchain)!')
        print(f'spring version: {spring.__version__}')
        "

    - name: Upload coverage report
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml
        if-no-files-found: ignore

    - name: pip-audit dependency vulnerability scan
      run: |
        echo "Running pip-audit for dependency vulnerabilities..."
        pip-audit -r requirements-lock.txt
        pip-audit -r requirements-ai.txt
        echo "pip-audit scan completed"

    - name: Generate SBOM
      run: |
        if [ -f scripts/generate_sbom.py ]; then
          echo "Generating SBOM..."
          python scripts/generate_sbom.py
        else
          echo "scripts/generate_sbom.py not found, skipping SBOM generation"
        fi

  middleware-integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt

    - name: Start real middleware
      run: docker compose -f docker-compose.integration.yml up -d --wait

    - name: Run integration tests
      env:
        RUN_INTEGRATION_TESTS: "1"
      run: pytest tests_integration/ -m integration -v --tb=short

    - name: Collect service logs
      if: failure()
      run: docker compose -f docker-compose.integration.yml logs --no-color

    - name: Stop middleware
      if: always()
      run: docker compose -f docker-compose.integration.yml down -v
