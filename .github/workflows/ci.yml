name: CI

# ====================================================================
# CI 工作流：核心 + AI + LangChain + LangGraph + MCP 全量测试
#
# 测试矩阵：
#   - Python 3.10 / 3.11 / 3.12
#   - 核心测试（无 AI 依赖）：spring 核心 + ORM + Web + 注解
#   - AI 测试：FakeChatModel 降级，无需 API Key
#   - LangChain/LangGraph/MCP 使用 Fake 模型或进程内协议服务，无需 API Key
#   - Demo 冒烟测试：15 章节完整能力演示
#
# 环境变量：
#   AI_ALLOW_FAKE=true — 无 API Key 时降级 FakeChatModel，保证 CI 无网络也能跑
# ====================================================================

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AI_ALLOW_FAKE: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt
        pip install pip-audit==2.10.1

    - name: Install AI & LangChain dependencies
      run: |
        pip install -r requirements-ai.txt
        pip install -r requirements-langgraph.txt
        pip install -r requirements-mcp.txt
        # 可选依赖：安装失败不阻塞 CI（测试中已用 pytest.importorskip 容错）
        pip install faiss-cpu || echo "faiss-cpu 不可用，相关测试将 skip"
        pip install pypdf || echo "pypdf 不可用，相关测试将 skip"
        pip install beautifulsoup4 || echo "beautifulsoup4 不可用，相关测试将 skip"
        pip install numexpr || echo "numexpr 不可用，LLMMathChain 测试将 skip"

    - name: Static code check with py_compile
      run: |
        echo "Compiling all Python files under spring/..."
        python -m py_compile $(find spring/ -name "*.py" -type f)
        echo "py_compile check passed"

    - name: Run core unit tests (no AI dependency)
      run: |
        pytest tests/ \
          --ignore=tests/test_ai_module.py \
          --ignore=tests/test_langchain_module.py \
          --ignore=tests/test_langchain_ext.py \
          --ignore=tests/test_langgraph_module.py \
          --ignore=tests/test_mcp_module.py \
          --ignore=tests/test_ai_declarative_annotations.py \
          -v --tb=short --cov=spring --cov-report= --cov-fail-under=0

    - name: Run LangGraph integration tests
      run: |
        pytest tests/test_langgraph_module.py tests/test_ai_declarative_annotations.py -v --tb=short

    - name: Run MCP protocol integration tests
      run: |
        pytest tests/test_mcp_module.py -v --tb=short

    - name: Run AI module tests (FakeChatModel)
      run: |
        echo "Running AI module tests..."
        pytest tests/test_ai_module.py -v --tb=short \
          --cov=spring.ai --cov-append --cov-report=term

    - name: Run LangChain module tests (FakeChatModel)
      run: |
        echo "Running LangChain base tests..."
        pytest tests/test_langchain_module.py -v --tb=short
        echo ""
        echo "Running LangChain extended tests..."
        pytest tests/test_langchain_ext.py -v --tb=short

    - name: Run LangChain demo smoke test (15 chapters)
      run: |
        echo "Running LangChain full demo (15 chapters, no API Key needed)..."
        python example_langchain/demo/langchain_full_demo.py

    - name: Run real runtime-path tests with cumulative coverage gate
      run: |
        pytest tests_runtime/ -v --tb=short \
          --cov=spring --cov-append --cov-report=xml --cov-report=term \
          --cov-fail-under=60

    - name: Module import verification (including spring.langchain)
      run: |
        python -c "
        import spring
        import spring.annotations
        import spring.annotations.core
        import spring.annotations.cloud
        import spring.annotations.messaging
        import spring.aop
        import spring.cloud
        import spring.config
        import spring.context
        import spring.core
        import spring.event
        import spring.logging
        import spring.messaging
        import spring.monitoring
        import spring.orm
        import spring.orm.pymybatis
        import spring.retry
        import spring.scheduling
        import spring.security
        import spring.tracing
        import spring.utils
        import spring.web
        import spring.ai
        import spring.langchain
        import spring.langgraph
        import spring.mcp
        print('All module imports successful (including AI, LangChain, LangGraph and MCP)!')
        print(f'spring version: {spring.__version__}')
        "

    - name: Upload coverage report
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml
        if-no-files-found: ignore

    - name: pip-audit dependency vulnerability scan
      run: |
        echo "Running pip-audit for dependency vulnerabilities..."
        pip-audit -r requirements-lock.txt --timeout 60 --progress-spinner off
        pip-audit -r requirements-ai.txt --timeout 60 --progress-spinner off
        pip-audit -r requirements-langgraph.txt --timeout 60 --progress-spinner off
        pip-audit -r requirements-mcp.txt --timeout 60 --progress-spinner off
        echo "pip-audit scan completed"

    - name: Generate SBOM
      run: |
        if [ -f scripts/generate_sbom.py ]; then
          echo "Generating SBOM..."
          python scripts/generate_sbom.py
        else
          echo "scripts/generate_sbom.py not found, skipping SBOM generation"
        fi

  middleware-integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt

    - name: Start real middleware
      run: docker compose -f docker-compose.integration.yml up -d --wait

    - name: Run integration tests
      env:
        RUN_INTEGRATION_TESTS: "1"
        RUN_SEATA_INTEGRATION_TESTS: "1"
        SEATA_BRIDGE_TOKEN: springpy-integration-secret
      run: pytest tests_integration/ -m integration -v --tb=short

    - name: Verify Redis outage fails closed
      run: |
        docker compose -f docker-compose.integration.yml stop redis
        RUN_FAILURE_INTEGRATION_TESTS=1 pytest \
          tests_integration/test_middleware_failure_modes.py::test_redis_outage_fails_closed \
          -v --tb=short
        docker compose -f docker-compose.integration.yml up -d --wait redis

    - name: Verify Seata bridge outage fails closed
      run: |
        docker compose -f docker-compose.integration.yml stop seata-bridge
        RUN_FAILURE_INTEGRATION_TESTS=1 pytest \
          tests_integration/test_middleware_failure_modes.py::test_seata_bridge_outage_fails_closed \
          -v --tb=short
        docker compose -f docker-compose.integration.yml up -d --wait seata-bridge

    - name: Collect service logs
      if: failure()
      run: docker compose -f docker-compose.integration.yml logs --no-color

    - name: Stop middleware
      if: always()
      run: docker compose -f docker-compose.integration.yml down -v
