name: Publish

# ====================================================================
# 发布工作流：构建 sdist + wheel 并发布到 PyPI。
#
# 触发方式：
#   - 发布 GitHub Release（types: published）时自动触发
#   - 支持手动触发（workflow_dispatch）
#
# 鉴权：使用 PyPI Trusted Publishing（OIDC），不在 GitHub 存放任何长期 API token。
#   首次发布前，必须在 PyPI 为项目 springbootAI 配置 Trusted Publisher：
#     仓库 owner = YUCONGGEN, 仓库 name = springboot_cloud_python
#     workflow filename = publish.yml, environment 留空
#   参见 https://docs.pypi.org/trusted-publishers/
# ====================================================================

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # PyPI Trusted Publishing（OIDC）要求 id-token 写权限
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        # 通过 OIDC 向 PyPI 认证，无需 API token；上传 dist/* 到 springbootAI
        uses: pypa/gh-action-pypi-publish@release/v1
