name: Publish

# ====================================================================
# 发布工作流：构建 sdist + wheel 并发布到 PyPI。
#
# 触发方式：
#   - 发布 GitHub Release（types: published）时自动触发
#   - 支持手动触发（workflow_dispatch）
#
# 鉴权：使用 PyPI Trusted Publishing（OIDC），不在 GitHub 存放任何长期 API token。
#   首次发布前，必须在 PyPI 为项目 springbootAI 配置 Trusted Publisher：
#     仓库 owner = YUCONGGEN, 仓库 name = springbootAI
#     workflow filename = publish.yml, environment 留空
#   参见 https://docs.pypi.org/trusted-publishers/
#
# 版本：2.0.0（pyproject.toml 单一来源）
# ====================================================================

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # PyPI Trusted Publishing（OIDC）要求 id-token 写权限
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version in pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Package version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::Version not found in pyproject.toml"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Verify langchain module is packaged
        run: |
          echo "Checking if spring.langchain is included in the wheel..."
          python -m zipfile -l dist/*.whl | grep "spring/langchain" || {
            echo "::error::spring.langchain module not found in wheel!"
            exit 1
          }
          echo "✅ spring.langchain module is included in the wheel"

      - name: Publish to PyPI
        # 通过 OIDC 向 PyPI 认证，无需 API token；上传 dist/* 到 springbootAI
        uses: pypa/gh-action-pypi-publish@release/v1
