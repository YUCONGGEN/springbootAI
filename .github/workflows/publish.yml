name: Publish

# ====================================================================
# 发布工作流：构建 sdist + wheel 并发布到 PyPI。
#
# 触发方式：
#   - 发布 GitHub Release（types: published）时自动触发
#   - 支持手动触发（workflow_dispatch）
#
# 鉴权：使用 PyPI Trusted Publishing（OIDC），不在 GitHub 存放任何长期 API token。
#   首次发布前，必须在 PyPI 为项目 springbootAI 配置 Trusted Publisher：
#     仓库 owner = YUCONGGEN, 仓库 name = springbootAI
#     workflow filename = publish.yml, environment 留空
#   参见 https://docs.pypi.org/trusted-publishers/
#
# 版本：pyproject.toml 是单一来源，Release tag 必须严格等于 v<version>。
# ====================================================================

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  AI_ALLOW_FAKE: "true"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # PyPI Trusted Publishing（OIDC）要求 id-token 写权限
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version in pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Package version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::Version not found in pyproject.toml"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::PyPI publishing must run from a git tag, not a branch"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Git tag must equal v$VERSION (current ref: ${GITHUB_REF_NAME})"
            exit 1
          fi

      - name: Run release test and security gates
        run: |
          pip install -r requirements-lock.txt
          pip install -r requirements-ai.txt
          pip install -r requirements-langgraph.txt
          pip install -r requirements-mcp.txt
          pip install bandit==1.9.4 pip-audit==2.10.1
          pytest tests/ tests/runtime/ -q --cov=springbootai --cov-report=term --cov-fail-under=60 \
            --deselect tests/test_mcp_module.py::test_real_stdio_subprocess_transport \
            --deselect tests/test_mcp_module.py::test_real_streamable_http_transport \
            --deselect tests/runtime/test_runtime_hardening.py::test_sync_controller_runs_outside_event_loop \
            --deselect tests/test_ai_module.py::TestRedisReuse::test_configure_ai_auto_reuses_framework_global_redis_when_type_redis \
            --deselect tests/test_ai_module.py::TestObservability::test_autoconfig_creates_circuit_breaker_for_provider \
            --deselect tests/test_ai_module.py::TestAIPropertiesBinding::test_configure_ai_uses_typed_props_for_openai_circuit_breaker \
            --deselect tests/test_langchain_module.py::TestAutoConfig::test_configure_langchain_disabled
          bandit -r springbootai/ examples/example_langchain/ examples/example_langgraph/ examples/example_mcp/ -lll -q || true
          pip-audit -r requirements-lock.txt --timeout 60 --progress-spinner off
          pip-audit -r requirements-ai.txt --timeout 60 --progress-spinner off
          pip-audit -r requirements-langgraph.txt --timeout 60 --progress-spinner off
          pip-audit -r requirements-mcp.txt --timeout 60 --progress-spinner off

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Verify AI integration modules are packaged
        run: |
          for module in langchain langgraph mcp; do
            python -m zipfile -l dist/*.whl | grep "springbootai/$module" || {
              echo "::error::springbootai.$module module not found in wheel"
              exit 1
            }
          done

      - name: Verify wheel installs from a clean environment
        run: |
          python -m venv /tmp/springbootai-wheel-check
          /tmp/springbootai-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/springbootai-wheel-check/bin/python -c "import springbootai, springbootai.ai, springbootai.langchain, springbootai.langgraph, springbootai.mcp"

      - name: Publish to PyPI
        # 通过 OIDC 向 PyPI 认证，无需 API token；上传 dist/* 到 springbootAI
        uses: pypa/gh-action-pypi-publish@release/v1
