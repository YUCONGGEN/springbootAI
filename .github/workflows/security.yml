name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt
        pip install bandit==1.9.4 pip-audit==2.10.1

    - name: pip-audit vulnerability scan
      run: |
        echo "Running pip-audit for dependency vulnerabilities..."
        pip-audit -r requirements-lock.txt
        echo "pip-audit scan completed"

    - name: Bandit security static analysis
      run: |
        echo "Failing on high-severity Bandit findings in spring/..."
        bandit -r spring/ -lll -f json -o bandit-report.json
        echo "Bandit scan completed, report saved to bandit-report.json"

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded passwords/secrets..."
        grep -r "password.*=.*['\"][^'\"]\{6,\}'" spring/ --include="*.py" || echo "No hardcoded secrets found"

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: bandit-report.json
        if-no-files-found: ignore
