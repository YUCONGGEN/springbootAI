name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt
        pip install bandit==1.9.4 pip-audit==2.10.1

    - name: pip-audit vulnerability scan
      run: |
        echo "Running pip-audit for dependency vulnerabilities..."
        pip-audit -r requirements-lock.txt
        echo "pip-audit scan completed"

    - name: Bandit security static analysis
      run: |
        echo "Failing on high-severity Bandit findings in spring/..."
        bandit -r spring/ -lll -f json -o bandit-report.json
        echo "Bandit scan completed, report saved to bandit-report.json"

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded passwords/secrets in spring/..."
        # 修复（P2）：旧版本 `grep ... || echo "No hardcoded secrets found"` 中 `||`
        # 使步骤无论是否匹配都退出 0（成功），检查形同虚设。
        # 新版本：匹配到潜在密钥则 exit 1（失败），并在 GitHub Actions UI 标注 error。
        #
        # 正则覆盖 password/passwd/secret/api_key/api-key/apikey/token/credential
        # 赋值语句，要求引号内字面值至少 6 字符（排除空串和短占位符）。
        # 第二个 grep -v 排除已知安全模式：枚举值、占位符、示例值、测试夹具。
        matches=$(grep -rnE --include="*.py" \
            "(password|passwd|secret|api[_-]?key|apikey|token|credential)[[:space:]]*=[[:space:]]*['\"][^'\"]{6,}['\"]" \
            spring/ \
            | grep -vE "(change-in-production|change-me|your-|placeholder|example|fake|dummy|insecure|xxxx|PASSWORD[[:space:]]*=[[:space:]]*'password')" \
            || true)
        if [ -n "$matches" ]; then
          echo "::error::Potential hardcoded secrets detected:"
          echo "$matches"
          echo "::error::Move secrets to environment variables or application.yml \${ENV:default} placeholders."
          exit 1
        fi
        echo "No hardcoded secrets found"

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: bandit-report.json
        if-no-files-found: ignore
