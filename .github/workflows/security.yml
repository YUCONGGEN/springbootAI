name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit

    - name: pip-audit vulnerability scan
      run: |
        echo "Running pip-audit for dependency vulnerabilities..."
        pip-audit || true
        echo "pip-audit scan completed"

    - name: Bandit security static analysis
      run: |
        echo "Running Bandit security scan on spring/ directory..."
        bandit -r spring/ -f json -o bandit-report.json || true
        echo "Bandit scan completed, report saved to bandit-report.json"

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded passwords/secrets..."
        grep -r "password.*=.*['\"][^'\"]\{6,\}'" spring/ --include="*.py" || echo "No hardcoded secrets found"

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: bandit-report.json
        if-no-files-found: ignore
