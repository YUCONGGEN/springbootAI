name: Security Scan

# ====================================================================
# 安全扫描工作流：依赖漏洞 + 静态分析 + 硬编码密钥检查
#
# 覆盖范围：
#   - springbootai/            核心框架代码
#   - springbootai/langchain/  LangChain 模块（新增）
#   - examples/example_langchain/ 演示应用
#
# 注意：safe_eval_arithmetic 使用 ast.parse 实现（非 eval），是安全设计，
#       Bandit B307(eval) 不会误报；如误报可在 .bandit 配置中排除。
# ====================================================================

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt
        pip install -r requirements-ai.txt
        pip install -r requirements-langgraph.txt
        pip install -r requirements-mcp.txt
        pip install bandit==1.9.4 pip-audit==2.10.1

    - name: pip-audit vulnerability scan (core + AI deps)
      run: |
        echo "Running pip-audit for core dependencies..."
        pip-audit -r requirements-lock.txt --timeout 60 --progress-spinner off
        echo "Running pip-audit for AI/LangChain dependencies..."
        pip-audit -r requirements-ai.txt --timeout 60 --progress-spinner off
        pip-audit -r requirements-langgraph.txt --timeout 60 --progress-spinner off
        pip-audit -r requirements-mcp.txt --timeout 60 --progress-spinner off
        echo "pip-audit scan completed"

    - name: Bandit security static analysis
      run: |
        echo "Blocking every medium/high finding across the repository..."
        bandit -r springbootai/ examples/example_langchain/ examples/example_langgraph/ examples/example_mcp/ \
          -ll -f json -o bandit-report.json
        echo "Bandit medium/high gate passed"

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded passwords/secrets in springbootai/ and examples/example_langchain/..."
        # 正则覆盖 password/passwd/secret/api_key/api-key/apikey/token/credential
        # 赋值语句，要求引号内字面值至少 6 字符（排除空串和短占位符）。
        # grep -v 排除已知安全模式：枚举值、占位符、示例值、测试夹具。
        matches=$(grep -rnE --include="*.py" \
            "(password|passwd|secret|api[_-]?key|apikey|token|credential)[[:space:]]*=[[:space:]]*['\"][^'\"]{6,}['\"]" \
            springbootai/ examples/example_langchain/ examples/example_langgraph/ examples/example_mcp/ \
            | grep -vE "(change-in-production|change-me|your-|placeholder|example|fake|dummy|insecure|xxxx|PASSWORD[[:space:]]*=[[:space:]]*'password')" \
            || true)
        if [ -n "$matches" ]; then
          echo "::error::Potential hardcoded secrets detected:"
          echo "$matches"
          echo "::error::Move secrets to environment variables or application.yml \${ENV:default} placeholders."
          exit 1
        fi
        echo "No hardcoded secrets found"

    - name: Verify SafeEval security (no eval/exec usage)
      run: |
        echo "Verifying safe_eval_arithmetic uses AST (not eval/exec)..."
        # 匹配任何形式的 eval() 调用（包括 str(eval(...))、return eval(...) 等变体）
        if grep -rnE "\beval\s*\(|exec\s*\(" springbootai/langchain/ examples/example_langchain/ \
            | grep -vE "(safe_eval_arithmetic|#.*eval|['\"]eval|eval\(\)[^a-zA-Z]|_eval\b|\.pyc)" \
            | grep -v "def safe_eval_arithmetic" \
            | grep -v "mode='eval'" ; then
          echo "::error::Found direct eval()/exec() usage — use safe_eval_arithmetic instead!"
          exit 1
        fi
        echo "SafeEval verification passed — no dangerous eval() in langchain module"

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: bandit-report.json
        if-no-files-found: ignore
